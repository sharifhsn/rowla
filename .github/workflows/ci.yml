name: Build and check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked --lib
      - run: cargo clippy --locked --lib -- -D warnings
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: scripts/build.sh
      - run: python3 -m unittest discover -s tests -v
        env:
          TASKBAR_TEST_BUNDLE: ${{ github.workspace }}/dist/Rowla.app
      - run: ditto -c -k --sequesterRsrc --keepParent 'dist/Rowla.app' 'dist/Rowla-${{ matrix.os }}.zip'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Rowla-${{ matrix.os }}-developer-build
          path: dist/*.zip
          retention-days: 7
