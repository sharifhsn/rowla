[package]
name = "taskbar-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
description = "Rowla: native Rust taskbar for macOS"
license = "MIT"
repository = "https://github.com/sharifhsn/rowla"
homepage = "https://github.com/sharifhsn/rowla"
exclude = ["/vendor/**", "/dist/**", "/diagnostics/**", "/release-assets/**", "/validation/**"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tempfile = "3.27"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-foundation = "0.3.2"
dispatch2 = "0.3.0"
block2 = "0.6.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
